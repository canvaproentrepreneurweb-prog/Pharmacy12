<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#111;color:white;font:16px Arial}canvas{display:block;width:1200px;height:auto}#meta{padding:12px}
</style></head><body><div id="meta">Analyse en cours...</div><canvas width="1200" height="1600"></canvas><video src="Exemple.mp4" muted preload="auto" style="display:none"></video><script>
const v=document.querySelector('video'),c=document.querySelector('canvas'),x=c.getContext('2d'),meta=document.querySelector('#meta');
v.addEventListener('loadedmetadata',async()=>{meta.textContent=`Durée: ${v.duration.toFixed(2)} s | Source: ${v.videoWidth} × ${v.videoHeight}`;const n=12,cols=3,rows=4,cw=400,ch=400;for(let i=0;i<n;i++){await seek((v.duration-.08)*i/(n-1));const scale=Math.min(cw/v.videoWidth,(ch-28)/v.videoHeight),w=v.videoWidth*scale,h=v.videoHeight*scale,ox=(i%cols)*cw+(cw-w)/2,oy=Math.floor(i/cols)*ch+28+(ch-28-h)/2;x.fillStyle='#080808';x.fillRect((i%cols)*cw,Math.floor(i/cols)*ch,cw,ch);x.drawImage(v,ox,oy,w,h);x.fillStyle='white';x.font='bold 18px Arial';x.fillText(`${((v.duration-.08)*i/(n-1)).toFixed(1)} s`,(i%cols)*cw+12,Math.floor(i/cols)*ch+21);}document.body.dataset.ready='true';});
function seek(t){return new Promise(r=>{v.onseeked=()=>r();v.currentTime=t})}
</script></body></html>
